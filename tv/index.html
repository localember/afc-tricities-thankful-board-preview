<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet"><title>Waiting room TV: AFC thankful board (design preview)</title><link rel="stylesheet" href="../assets/styles.css">
<style>
html,body{height:100%;overflow:hidden;background:#0E465B}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;background:radial-gradient(ellipse at 30% 60%,#FFF8EC 0%,#FBEFDC 55%,#F3E2C6 100%);overflow:hidden}
.tvbanner{position:absolute;top:0;left:0;right:0;height:44px;background:#F59E0B;color:#1f1300;font:800 22px/44px var(--font-body);text-align:center;letter-spacing:.03em;z-index:5}
.tvhead{position:absolute;top:44px;left:0;right:0;height:150px;display:flex;align-items:center;padding:0 64px;gap:40px;background:#fff;border-bottom:6px solid var(--primary)}
.tvhead img{height:110px}
.tvhead .t{flex:1}
.tvhead small{font:800 24px var(--font-body);color:var(--primary);text-transform:uppercase;letter-spacing:.12em}
.tvhead h1{font:800 54px/1.1 var(--font-heading);color:var(--primary-dark);margin-top:4px}
.count{text-align:right;font:700 24px var(--font-body);color:var(--slate)}
.count b{display:block;font:800 72px/1 var(--font-heading);color:var(--primary)}
#art{position:absolute;left:40px;top:205px;width:860px;height:860px}
.slot{transition:fill .8s,opacity .8s,transform .8s}
.slot.empty{fill:#fff;fill-opacity:.55;stroke:#96BDCB;stroke-width:4;stroke-dasharray:12 10}
.slot.lit{filter:drop-shadow(0 0 16px rgba(255,200,60,.95))}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.new{animation:pop 1s ease-out both;transform-box:fill-box;transform-origin:50% 100%}
.spot{position:absolute;left:940px;top:250px;width:920px;height:640px;background:#fff;border-radius:36px;box-shadow:0 24px 60px rgba(14,70,91,.18);padding:64px 70px;display:flex;flex-direction:column;justify-content:center;border-top:14px solid var(--primary)}
.spot .eyebrow{font:800 26px var(--font-body);color:var(--primary);letter-spacing:.08em;text-transform:uppercase;display:flex;gap:18px;align-items:center}
.spot .eyebrow .tag{background:#FEF3C7;color:#92400E;border-radius:999px;padding:4px 18px;font-size:22px;letter-spacing:.04em}
.spot .eyebrow .tag.fresh{background:#DCFCE7;color:#166534}
.spot .msg{font:800 72px/1.18 var(--font-heading);color:var(--ink);margin-top:28px;transition:opacity .5s}
.spot .msg.small{font-size:58px}
.spot img{width:100%;max-height:400px;object-fit:contain;margin-top:20px}
.spot .fade{opacity:0}
.dots{display:flex;gap:12px;margin-top:40px;flex-wrap:wrap}
.dots i{width:18px;height:18px;border-radius:50%;background:#E5EAF0}
.dots i.on{background:var(--primary)}
.foot{position:absolute;left:940px;top:920px;width:920px;display:flex;align-items:center;gap:28px;color:var(--primary-dark)}
.qr{width:120px;height:120px;border-radius:14px;background:#fff;border:4px dashed var(--primary-light);display:grid;place-items:center;font:800 18px/1.2 var(--font-body);color:var(--primary);text-align:center;flex:none}
.foot b{font:800 40px var(--font-heading);display:block}
.foot span{font:600 26px var(--font-body);color:var(--slate)}
#fs{position:fixed;right:14px;bottom:14px;z-index:9;opacity:.75}
.empty-msg{font:700 56px/1.2 var(--font-heading);color:var(--primary-dark)}
</style></head><body>
<div id="stage">
<div class="tvbanner">Design preview, not live. Sample notes only.</div>
<header class="tvhead"><img src="https://www.afctricities.com/wp-content/uploads/2026/04/Advanced-Family-Chiropractic-Logo-v1.png" alt="Advanced Family Chiropractic logo"><div class="t"><small id="month">November thankful board</small><h1 id="question">Why are you thankful for chiropractic?</h1></div><div class="count"><b id="num">0</b><span id="unit">feathers of thanks</span></div></header>
<svg id="art" viewBox="0 0 900 900" aria-label="Thankful board artwork"></svg>
<section class="spot" id="spot"></section>
<div class="foot"><div class="qr">QR code<br>goes here</div><div><b>Add your note!</b><span>Scan the code or ask for the office iPad.</span></div></div>
</div>
<button class="btn small ghost" id="fs">Full screen</button>
<script src="../assets/app.js"></script>
<script>
(function(){
var NS='http://www.w3.org/2000/svg',art=document.getElementById('art'),E=AFC.esc;
var COLORS={turkey:['#C2410C','#F59E0B','#B91C1C','#D97706','#176D8C','#EA580C','#92400E','#FBBF24','#9F1239','#0E465B','#E8590C','#CA8A04'],
ornaments:['#B91C1C','#FBBF24','#176D8C','#E5E7EB','#9F1239','#F59E0B','#0E465B','#96BDCB'],
hearts:['#E0457B','#BE185D','#F472B6','#B91C1C','#FB7185','#9F1239','#F9A8D4']};
var seen=null,idx=0,timer=null,fresh=null;
function el(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);(p||art).appendChild(e);return e;}
function slots(theme){
 var s=[];
 if(theme==='turkey'){
  var outer=[],inner=[];
  for(var i=0;i<12;i++)outer.push(-77+i*14);
  for(var j=0;j<9;j++)inner.push(-64+j*16);
  function ord(a){return a.slice().sort(function(x,y){return Math.abs(x)-Math.abs(y)||x-y;});}
  ord(outer).forEach(function(a){s.push({kind:'feather',a:a,len:410,w:66});});
  ord(inner).forEach(function(a){s.push({kind:'feather',a:a,len:300,w:58});});
 }else if(theme==='ornaments'){
  for(var r=1;r<=6;r++){var y=210+r*88;var half=(y-90)*0.33;for(var k=0;k<r;k++){var x=r===1?450:450-half+(2*half)*k/(r-1);s.push({kind:'orn',x:x,y:y});}}
 }else{
  ['.##.##.','#######','#######','.#####.','..###..','...#...'].forEach(function(row,gy){row.split('').forEach(function(ch,gx){if(ch==='#')s.push({kind:'heart',x:450+(gx-3)*112,y:190+gy*108});});});
 }
 return s;
}
function drawArt(theme,count,lit,newIdx){
 art.innerHTML='';var S=slots(theme),pal=COLORS[theme];
 if(theme==='turkey'){
  el('ellipse',{cx:450,cy:860,rx:330,ry:26,fill:'#E9D5B0'});
  var g=el('g',{});
  S.slice().reverse().forEach(function(sl,ri){var i=S.length-1-ri;var filled=i<count;
   var fg=el('g',{transform:'translate(450 600) rotate('+sl.a+')'},g);
   var p=el('path',{d:'M0 0C-'+sl.w+' -'+sl.len*0.35+' -'+sl.w+' -'+sl.len*0.75+' 0 -'+sl.len+'C'+sl.w+' -'+sl.len*0.75+' '+sl.w+' -'+sl.len*0.35+' 0 0Z','class':'slot '+(filled?'':'empty')+(i===lit?' lit':'')+(i===newIdx?' new':''),fill:filled?pal[i%pal.length]:'#fff'},fg);
   if(filled)el('path',{d:'M0 -20L0 -'+(sl.len-30),stroke:'rgba(255,255,255,.55)','stroke-width':5,'stroke-linecap':'round',fill:'none'},fg);
  });
  el('path',{d:'M405 790l-10 60M395 850l-25 14M395 850l0 18M395 850l22 12M495 790l10 60M505 850l-22 12M505 850l0 18M505 850l25 14',stroke:'#E8590C','stroke-width':12,'stroke-linecap':'round',fill:'none'});
  el('ellipse',{cx:450,cy:640,rx:165,ry:175,fill:'#8B5A2B'});
  el('ellipse',{cx:450,cy:680,rx:105,ry:125,fill:'#C08552'});
  el('path',{d:'M330 600q-40 80 10 150q30-60 30-130z',fill:'#6F4520'});el('path',{d:'M570 600q40 80-10 150q-30-60-30-130z',fill:'#6F4520'});
  el('circle',{cx:450,cy:430,r:88,fill:'#A0522D'});
  el('circle',{cx:418,cy:410,r:20,fill:'#fff'});el('circle',{cx:482,cy:410,r:20,fill:'#fff'});
  el('circle',{cx:422,cy:414,r:10,fill:'#0F172A'});el('circle',{cx:478,cy:414,r:10,fill:'#0F172A'});
  el('path',{d:'M428 446l22 38l22-38z',fill:'#F59E0B'});
  el('path',{d:'M462 460q24 18 10 62q-26-10-20-50z',fill:'#B91C1C'});
  el('ellipse',{cx:395,cy:462,rx:16,ry:9,fill:'#E9967A',opacity:.7});el('ellipse',{cx:505,cy:462,rx:16,ry:9,fill:'#E9967A',opacity:.7});
 }else if(theme==='ornaments'){
  el('rect',{x:410,y:800,width:80,height:70,rx:8,fill:'#7C4A21'});
  el('path',{d:'M450 90L790 810H110Z',fill:'#2F6E4F'});
  el('path',{d:'M450 90L640 500H260Z',fill:'#3B8762',opacity:.6});
  el('path',{d:'M450 40l14 30 32 4-24 22 6 32-28-16-28 16 6-32-24-22 32-4z',fill:'#FBBF24'});
  S.forEach(function(sl,i){var filled=i<count;el('line',{x1:sl.x,y1:sl.y-44,x2:sl.x,y2:sl.y-30,stroke:'#CBD5E1','stroke-width':4});
   el('circle',{cx:sl.x,cy:sl.y,r:30,'class':'slot '+(filled?'':'empty')+(i===lit?' lit':'')+(i===newIdx?' new':''),fill:filled?pal[i%pal.length]:'#fff'});});
 }else{
  S.forEach(function(sl,i){var filled=i<count;var x=sl.x,y=sl.y;
   el('path',{d:'M'+x+' '+(y+42)+'C'+(x-70)+' '+(y-5)+' '+(x-52)+' '+(y-55)+' '+x+' '+(y-24)+'C'+(x+52)+' '+(y-55)+' '+(x+70)+' '+(y-5)+' '+x+' '+(y+42)+'Z','class':'slot '+(filled?'':'empty')+(i===lit?' lit':'')+(i===newIdx?' new':''),fill:filled?pal[i%pal.length]:'#fff'});});
 }
 return S.length;
}
function approved(){return AFC.all().filter(function(n){return n.status==='approved';}).sort(function(a,b){return (a.approvedTs||a.ts)-(b.approvedTs||b.ts);});}
function render(newId){
 var th=AFC.theme(),list=approved(),total;
 document.getElementById('question').textContent=th.question;
 document.getElementById('month').textContent=th.month+(th.live?' thankful board':' theme preview, coming soon');
 document.getElementById('num').textContent=list.length;
 document.getElementById('unit').textContent=(list.length===1?th.unit:th.units)+' of thanks';
 if(idx>=list.length)idx=0;
 var newIdx=-1;if(newId){list.forEach(function(n,i){if(n.id===newId){idx=i;newIdx=i;}});}
 total=drawArt(th.id,Math.min(list.length,99),list.length?idx:-1,newIdx);
 var spot=document.getElementById('spot');
 if(!list.length){spot.innerHTML='<div class="eyebrow">Our thankful board</div><div class="empty-msg" style="margin-top:24px">Be the first to add a '+th.unit+'!</div>';return;}
 var n=list[idx],shown=Math.min(list.length,total);
 var tag=n.sample?'<span class="tag">Sample</span>':(n.id===fresh?'<span class="tag fresh">New</span>':'');
 var body=n.type==='ink'?'<img src="'+n.img+'" alt="Handwritten thankful note">':'<div class="msg'+(n.text.length>60?' small':'')+'">&ldquo;'+E(n.text)+'&rdquo;</div>';
 spot.innerHTML='<div class="eyebrow">Thankful note '+(idx+1)+' of '+list.length+tag+'</div>'+body+'<div class="dots">'+list.map(function(_,i){return '<i class="'+(i===idx?'on':'')+'"></i>';}).join('')+'</div>';
}
function cycle(){clearInterval(timer);timer=setInterval(function(){var l=approved();if(l.length>1){idx=(idx+1)%l.length;render();}},7000);}
function changed(){
 var ids=approved().map(function(n){return n.id;});var newId=null;
 if(seen){ids.forEach(function(id){if(seen.indexOf(id)<0)newId=id;});}
 seen=ids;if(newId)fresh=newId;render(newId);if(newId)cycle();
}
function fit(){var s=Math.min(innerWidth/1920,innerHeight/1080);document.getElementById('stage').style.transform='translate(-50%,-50%) scale('+s+')';}
window.addEventListener('resize',fit);fit();
document.getElementById('fs').onclick=function(){if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();};
var hideT;document.addEventListener('mousemove',function(){var b=document.getElementById('fs');b.style.display='';clearTimeout(hideT);hideT=setTimeout(function(){b.style.display='none';},3000);});
AFC.onChange(changed);changed();cycle();
})();
</script></body></html>
