<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=Caveat:wght@600&display=swap" rel="stylesheet"><title>Waiting room TV: AFC thankful board (design preview)</title><link rel="stylesheet" href="../assets/styles.css">
<style>
html,body{height:100%;overflow:hidden;background:#0E465B}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;background:radial-gradient(ellipse at 50% 70%,#FFF8EC 0%,#FBEFDC 55%,#F3E2C6 100%);overflow:hidden}
.tvbanner{position:absolute;top:0;left:0;right:0;height:44px;background:#F59E0B;color:#1f1300;font:800 22px/44px var(--font-body);text-align:center;letter-spacing:.03em;z-index:5}
.tvhead{position:absolute;top:44px;left:0;right:0;height:150px;display:flex;align-items:center;padding:0 64px;gap:40px;background:#fff;border-bottom:6px solid var(--primary);z-index:4}
.tvhead img{height:110px}
.tvhead .t{flex:1}
.tvhead small{font:800 24px var(--font-body);color:var(--primary);text-transform:uppercase;letter-spacing:.12em}
.tvhead h1{font:800 54px/1.1 var(--font-heading);color:var(--primary-dark);margin-top:4px}
.count{text-align:right;font:700 24px var(--font-body);color:var(--slate)}
.count b{display:block;font:800 72px/1 var(--font-heading);color:var(--primary)}
#flock{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:960px 1040px;transition:transform .7s ease}
#board{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:1}
.feather{position:absolute;transform-origin:50% 100%;filter:drop-shadow(0 8px 10px rgba(60,30,0,.24))}
.feather .vane{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden}
.feather .vane:before{content:"";position:absolute;left:50%;top:8%;bottom:0;width:5px;margin-left:-2.5px;background:rgba(255,255,255,.35);border-radius:3px}
.feather .words{position:absolute;left:50%;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font:800 26px/1.08 var(--font-heading);text-shadow:0 2px 4px rgba(0,0,0,.35);padding:0}
.feather .words span{display:block;max-width:100%}
.feather .words img{max-width:100%;max-height:100%;background:transparent;padding:0;filter:brightness(0) invert(1)}
.feather.new{animation:grow 1.2s ease-out both}
.feather.new{filter:drop-shadow(0 0 6px rgba(255,214,90,1)) drop-shadow(0 0 22px rgba(255,200,60,.95))}
@keyframes grow{0%{scale:.1;opacity:0}70%{scale:1.06;opacity:1}100%{scale:1;opacity:1}}
#body{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;z-index:2}
.token{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font:800 24px/1.15 var(--font-heading);padding:18px;box-shadow:0 10px 24px rgba(0,0,0,.18);text-shadow:0 2px 4px rgba(0,0,0,.3)}
.token img{max-width:100%;max-height:100%;background:transparent;filter:brightness(0) invert(1)}
.foot{position:absolute;left:60px;bottom:40px;width:520px;display:flex;align-items:center;gap:24px;color:var(--primary-dark);z-index:3}
.qr{width:120px;height:120px;border-radius:14px;background:#fff;border:4px dashed var(--primary-light);display:grid;place-items:center;font:800 18px/1.2 var(--font-body);color:var(--primary);text-align:center;flex:none}
.foot b{font:800 40px var(--font-heading);display:block}
.foot span{font:600 26px var(--font-body);color:var(--slate)}
#fs{position:fixed;right:14px;bottom:14px;z-index:9;opacity:.75}
</style></head><body>
<div id="stage">
<div class="tvbanner">Design preview, not live. Sample notes only.</div>
<header class="tvhead"><img src="https://www.afctricities.com/wp-content/uploads/2026/04/Advanced-Family-Chiropractic-Logo-v1.png" alt="Advanced Family Chiropractic logo"><div class="t"><small id="month">November thankful board</small><h1 id="question">Why are you thankful for chiropractic?</h1></div><div class="count"><b id="num">0</b><span id="unit">feathers of thanks</span></div></header>
<div id="flock">
<div id="board" aria-label="Thankful board"></div>
<svg id="body" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
</div>
<div class="foot"><div class="qr">QR code<br>goes here</div><div><b>Add your note!</b><span>Scan the code or ask for the office iPad.</span></div></div>
</div>
<button class="btn small ghost" id="fs">Full screen</button>
<script src="../assets/app.js"></script>
<script>
(function(){
var NS='http://www.w3.org/2000/svg',board=document.getElementById('board'),body=document.getElementById('body'),flock=document.getElementById('flock'),E=AFC.esc;
var COLORS={turkey:['#C2410C','#176D8C','#B91C1C','#92400E','#0E465B','#9F1239','#B45309','#155E75','#9A3412','#BE123C','#7C2D12','#1E5A70','#A16207'],
ornaments:['#B91C1C','#176D8C','#9F1239','#0E465B','#B45309','#2F6E4F'],
hearts:['#BE185D','#9F1239','#B91C1C','#DB2777','#E11D48']};
/* Layered rings like a real turkey tail: ring 0 (front) holds the shortest feathers; each ring behind is longer so its tip, where the words sit, shows past the ring in front. A new ring starts only when the ring in front is full. */
var PX=960,PY=820,ORIGIN_X=960,ORIGIN_Y=1040;
var RING={first:600,step:240,spread:78,tip:40,text:190,minW:80};
var SAFE={top:214,left:36,right:1884,bottom:1070};
var seen=null,fresh=null;
var demo=null;try{var q=new URLSearchParams(location.search).get('demo');if(q!==null)demo=parseInt(q,10)||0;}catch(e){}
var DEMO_TEXT=['Sample: The friendly team every visit','Sample: Feeling cared for','Sample: A welcoming front desk that knows my family','Sample: Time set aside just for me','Sample: Kind people and a calm office','Sample: Being listened to','Sample: Less pain on busy days','Sample: A calm place to land','Sample: They know my family','Sample: Sleeping better','Sample: Easy to get in','Sample: I can move again','Sample: Health I can count on','Sample: They always listen','Sample: Help with my back','Sample: Feeling like myself','Sample: Grateful for this care','Sample: So much support','Sample: Better days ahead','Sample: Relief that lasts'];
function el(t,a){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);body.appendChild(e);return e;}
function inkImage(text){
 var o=document.createElement('canvas');o.width=520;o.height=200;
 var x=o.getContext('2d');x.fillStyle='#0E465B';x.font='600 64px Caveat, cursive';
 var lines=[text];
 if(x.measureText(text).width>480){var w=text.split(' '),best=1,bd=1e9;for(var i=1;i<w.length;i++){var d=Math.abs(x.measureText(w.slice(0,i).join(' ')).width-x.measureText(w.slice(i).join(' ')).width);if(d<bd){bd=d;best=i;}}lines=[w.slice(0,best).join(' '),w.slice(best).join(' ')];}
 var fs=lines.length>1?64:72;do{x.font='600 '+fs+'px Caveat, cursive';fs-=3;}while(Math.max.apply(null,lines.map(function(l){return x.measureText(l).width;}))>490&&fs>22);
 x.textAlign='center';x.textBaseline='middle';
 x.strokeStyle='#0E465B';x.lineWidth=4;x.lineJoin='round';
 if(lines.length>1){x.strokeText(lines[0],260,62);x.fillText(lines[0],260,62);x.strokeText(lines[1],260,138);x.fillText(lines[1],260,138);}else{x.strokeText(text,260,100);x.fillText(text,260,100);}
 return o.toDataURL('image/png');
}
function demoNotes(n){
 var t=Date.now(),out=[];
 for(var i=0;i<n;i++){
  var raw=DEMO_TEXT[i%DEMO_TEXT.length];
  var label=i<DEMO_TEXT.length?raw:('Sample: '+raw.replace(/^Sample: /,''));
  var ink=(i%5===1);
  var note={id:'d'+i,status:'approved',sample:true,ts:t-(n-i)*1000};
  if(ink){note.type='ink';note.img=inkImage(label.replace(/^Sample: /,''));note.text='';}
  else{note.type='text';note.text=label;}
  out.push(note);
 }
 return out;
}
function approved(){
 var all=AFC.all();
 if(demo!==null)return demoNotes(demo);
 return all.filter(function(n){return n.sample?n.status!=='declined':n.status==='approved';}).sort(function(a,b){return (a.status==='approved'?(a.approvedTs||a.ts):a.ts)-(b.status==='approved'?(b.approvedTs||b.ts):b.ts);});
}
function words(n){
 if(n.type==='ink')return '<img src="'+n.img+'" alt="Handwritten thankful note">';
 return '<span>'+E(n.text||'')+'</span>';
}
function centerOut(angles){return angles.slice().sort(function(x,y){return Math.abs(x)-Math.abs(y)||x-y;});}
function ringInfo(k){
 var len=RING.first+k*RING.step,rIn=len-RING.tip-RING.text,span=2*RING.spread*Math.PI/180;
 var count=Math.floor(span/(RING.minW/rIn))+1;
 return {len:len,rIn:rIn,count:count,stepRad:span/(count-1)};
}
/* Longer notes get a slightly wider feather and shorter notes a slightly narrower one, so every note can use a readable size. */
function weight(n){
 if(n.type==='ink')return 1;
 var c=(n.text||'').length;return Math.max(0.8,Math.min(1.7,c/32));
}
function layout(list){
 var slots=[],k=0,i=0,n=list.length;
 while(i<n&&k<12){
  var r=ringInfo(k),grp=[],sum=0;
  while(i<n){var w=weight(list[i]);if(grp.length&&sum+w>r.count+0.001)break;grp.push(w);sum+=w;i++;}
  var m=grp.length,order=[],j;
  for(j=(m-1)%2?m-1:m-2;j>=1;j-=2)order.push(j);
  order.push(0);
  for(j=2;j<m;j+=2)order.push(j);
  var pos=-sum*r.stepRad/2,ang=new Array(m),wid=new Array(m);
  order.forEach(function(idx){var wr=grp[idx]*r.stepRad;ang[idx]=(pos+wr/2)*180/Math.PI;wid[idx]=wr;pos+=wr;});
  for(j=0;j<m;j++){
   var tipW=0.95*wid[j]*r.len,bw=14;
   slots.push({angle:Math.round(ang[j]*100)/100,len:r.len,w:tipW,bw:bw,th:Math.floor(0.92*(bw+(tipW-bw)*r.rIn/r.len)),layer:k});
  }
  k++;
 }
 return slots;
}
function vanePath(sl){
 var w=sl.w,L=sl.len,c=w/2,h=Math.min(w*0.62,L*0.4),b=sl.bw/2;
 return 'M'+(c-b)+' '+L+'L'+0+' '+h+'C0 '+(h*0.35)+' '+(c-w*0.3)+' 0 '+c+' 0C'+(c+w*0.3)+' 0 '+w+' '+(h*0.35)+' '+w+' '+h+'L'+(c+b)+' '+L+'Z';
}
function outline(sl){
 var w=sl.w,L=sl.len,h=Math.min(w*0.62,L*0.4),pts=[],steps=12,i;
 for(i=0;i<=steps;i++){var t=i/steps,y=L-(L-h)*t,hw=sl.bw/2+(w/2-sl.bw/2)*t;pts.push([-hw,y],[hw,y]);}
 pts.push([0,0],[-w*0.35,h*0.25],[w*0.35,h*0.25]);
 var rad=sl.angle*Math.PI/180,cs=Math.cos(rad),sn=Math.sin(rad);
 return pts.map(function(p){var lx=p[0],ly=p[1]-L;return {x:PX+lx*cs-ly*sn,y:PY+lx*sn+ly*cs};});
}
function fitScale(slots){
 var pts=[{x:600,y:1050},{x:1320,y:1050},{x:960,y:490},{x:776,y:780},{x:1144,y:780}];
 slots.forEach(function(sl){pts=pts.concat(outline(sl));});
 var ft=document.querySelector('.foot'),m=24,box={l:ft.offsetLeft-m,t:ft.offsetTop-m,r:ft.offsetLeft+ft.offsetWidth+m,b:ft.offsetTop+ft.offsetHeight+m};
 function ok(s){
  for(var i=0;i<pts.length;i++){
   var x=ORIGIN_X+(pts[i].x-ORIGIN_X)*s,y=ORIGIN_Y+(pts[i].y-ORIGIN_Y)*s;
   if(x<SAFE.left||x>SAFE.right||y<SAFE.top||y>SAFE.bottom)return false;
   if(x>box.l&&x<box.r&&y>box.t&&y<box.b)return false;
  }
  return true;
 }
 if(ok(1))return 1;
 var lo=0.2,hi=1;
 for(var j=0;j<24;j++){var mid=(lo+hi)/2;if(ok(mid))lo=mid;else hi=mid;}
 return Math.floor(lo*1000)/1000;
}
function fitText(wd,th){
 var sp=wd.querySelector('span');if(!sp)return;
 var fs=36;sp.style.fontSize=fs+'px';
 while(fs>12&&(sp.offsetHeight>th||sp.scrollWidth>RING.text)){fs-=1;sp.style.fontSize=fs+'px';}
}
var inkCache={};
function trimInk(img,key){
 if(inkCache[key]){img.src=inkCache[key];return;}
 var src=img.getAttribute('src'),im=new Image();
 im.onload=function(){
  try{
   var c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;var x=c.getContext('2d');x.drawImage(im,0,0);
   var d=x.getImageData(0,0,c.width,c.height).data,minX=c.width,minY=c.height,maxX=-1,maxY=-1;
   for(var yy=0;yy<c.height;yy++)for(var xx=0;xx<c.width;xx++){var o=(yy*c.width+xx)*4;if(d[o+3]>20&&(d[o]<235||d[o+1]<235||d[o+2]<235)){if(xx<minX)minX=xx;if(xx>maxX)maxX=xx;if(yy<minY)minY=yy;if(yy>maxY)maxY=yy;}}
   if(maxX<0)return;
   var pad=6;minX=Math.max(0,minX-pad);minY=Math.max(0,minY-pad);maxX=Math.min(c.width-1,maxX+pad);maxY=Math.min(c.height-1,maxY+pad);
   var o2=document.createElement('canvas');o2.width=maxX-minX+1;o2.height=maxY-minY+1;
   o2.getContext('2d').drawImage(c,minX,minY,o2.width,o2.height,0,0,o2.width,o2.height);
   inkCache[key]=o2.toDataURL('image/png');img.src=inkCache[key];
  }catch(e){}
 };
 im.src=src;
}
function drawTurkey(){
 body.innerHTML='';
 el('ellipse',{cx:960,cy:1050,rx:360,ry:24,fill:'#E9D5B0'});
 el('path',{d:'M905 990l-12 50M893 1040l-28 12M893 1040l0 18M893 1040l24 12M1015 990l12 50M1027 1040l-24 12M1027 1040l0 18M1027 1040l28 12',stroke:'#E8590C','stroke-width':12,'stroke-linecap':'round',fill:'none'});
 el('ellipse',{cx:960,cy:820,rx:190,ry:200,fill:'#8B5A2B'});
 el('ellipse',{cx:960,cy:865,rx:120,ry:140,fill:'#C08552'});
 el('path',{d:'M822 780q-46 92 12 172q34-70 34-150z',fill:'#6F4520'});el('path',{d:'M1098 780q46 92-12 172q-34-70-34-150z',fill:'#6F4520'});
 el('circle',{cx:960,cy:590,r:100,fill:'#A0522D'});
 el('circle',{cx:924,cy:568,r:22,fill:'#fff'});el('circle',{cx:996,cy:568,r:22,fill:'#fff'});
 el('circle',{cx:928,cy:572,r:11,fill:'#0F172A'});el('circle',{cx:992,cy:572,r:11,fill:'#0F172A'});
 el('path',{d:'M935 608l25 42l25-42z',fill:'#F59E0B'});
 el('path',{d:'M972 624q27 20 11 70q-29-11-23-56z',fill:'#B91C1C'});
 el('ellipse',{cx:899,cy:624,rx:18,ry:10,fill:'#E9967A',opacity:.7});el('ellipse',{cx:1021,cy:624,rx:18,ry:10,fill:'#E9967A',opacity:.7});
}
function drawFeathers(list,newId){
 board.innerHTML='';var pal=COLORS.turkey;
 var slots=layout(list);
 var sc=fitScale(slots);flock.style.transform='scale('+sc+')';
 board.setAttribute('data-rings',slots.length?slots[slots.length-1].layer+1:0);board.setAttribute('data-scale',sc);
 list.forEach(function(n,i){
  var sl=slots[i],a=sl.angle,len=sl.len,w=sl.w;
  var f=document.createElement('div');
  f.className='feather'+(n.id===newId?' new':'');
  f.style.cssText='left:'+(PX-w/2)+'px;top:'+(PY-len)+'px;width:'+w+'px;height:'+len+'px;z-index:'+(50-sl.layer)+';transform:rotate('+a+'deg)';
  var rot=a<0?90:-90,tw=RING.text,th=sl.th,cy=RING.tip+tw/2;
  f.innerHTML='<div class="vane" style="background:'+pal[i%pal.length]+';clip-path:path(\''+vanePath(sl)+'\')"><div class="words" style="width:'+tw+'px;height:'+th+'px;margin-left:'+(-tw/2)+'px;top:'+(cy-th/2)+'px;transform:rotate('+rot+'deg)">'+words(n)+'</div></div>';
  board.appendChild(f);
  var wd=f.querySelector('.words');fitText(wd,th);
  var im=wd.querySelector('img');if(im)trimInk(im,n.id+':'+(n.img||'').length);
 });
}
function drawTokens(theme,list,newId){
 body.innerHTML='';board.innerHTML='';flock.style.transform='scale(1)';
 var pal=COLORS[theme];
 var show=list.slice(),cols=4,rows=Math.max(3,Math.ceil(show.length/cols));
 var cw=Math.min(380,1600/cols),chh=Math.min(230,(1080-240)/rows),x0=(1920-cols*cw)/2;
 var scale=1;if(230+rows*chh>980){scale=(980-230)/(rows*chh);chh=chh;}
 show.forEach(function(n,i){var t=document.createElement('div');t.className='token'+(n.id===newId?' new':'');
  var r=theme==='hearts'?'46% 46% 50% 50% / 40% 40% 60% 60%':'50%';
  t.style.cssText='left:'+(x0+(i%cols)*cw+20)+'px;top:'+(230+Math.floor(i/cols)*chh+10)+'px;width:'+(cw-40)+'px;height:'+(chh-20)+'px;border-radius:'+r+';background:'+pal[i%pal.length]+';transform:scale('+scale+')';
  t.innerHTML=words(n);board.appendChild(t);});
}
function render(newId){
 var th=AFC.theme(),list=approved();
 document.getElementById('question').textContent=th.question;
 document.getElementById('month').textContent=th.month+(th.live?' thankful board':' theme preview, coming soon');
 document.getElementById('num').textContent=list.length;
 document.getElementById('unit').textContent=(list.length===1?th.unit:th.units)+' of thanks';
 if(th.id==='turkey'){drawTurkey();drawFeathers(list,newId);}else{drawTokens(th.id,list,newId);}
}
function changed(){
 var ids=approved().map(function(n){return n.id;});var newId=null;
 if(seen){ids.forEach(function(id){if(seen.indexOf(id)<0)newId=id;});}
 seen=ids;if(newId)fresh=newId;render(newId);
}
function fit(){var s=Math.min(innerWidth/1920,innerHeight/1080);document.getElementById('stage').style.transform='translate(-50%,-50%) scale('+s+')';}
window.addEventListener('resize',fit);fit();
document.getElementById('fs').onclick=function(){if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen();};
var hideT;document.addEventListener('mousemove',function(){var b=document.getElementById('fs');b.style.display='';clearTimeout(hideT);hideT=setTimeout(function(){b.style.display='none';},3000);});
function start(){AFC.onChange(changed);changed();}
if(document.fonts&&document.fonts.ready)Promise.all([document.fonts.ready,document.fonts.load('600 64px Caveat')]).then(start,start);else start();
})();
</script></body></html>
